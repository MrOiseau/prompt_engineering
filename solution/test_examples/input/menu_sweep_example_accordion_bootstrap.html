                aria-expanded="true">
                Breakfast
            </button>
        </h2>
        <div id="collapseBreakfast" class="accordion-collapse collapse show">
            <div class="accordion-body">
                <div class="menu-item">
                    <span>Pancakes</span>
                    <span class="price">$9.00</span>
                </div>
                <div class="menu-item">
                    <span>Omelette</span>
                    <span class="price">$8.50</span>

            </div>

    </div>

    <div class="accordion-item">
        <h2 class="accordion-header" id="headingLunch">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                data-bs-target="#collapseLunch" aria-expanded="false">
                Lunch
            </button>

        <div id="collapseLunch" class="accordion-collapse collapse show">

                <div class="menu-item">
